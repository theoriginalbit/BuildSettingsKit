name: Swift Test
on:
  push:
    branches: ["main"]
jobs:
  test:
    runs-on: macos-latest
    steps:
    - uses: actions/cache@v6
      with:
        path: |
          .build/checkouts
          .build/repositories
          .build/artifacts
        key: ${{ runner.os }}-spm-deps-${{ hashFiles('Package.resolved') }}
        restore-keys: |
          ${{ runner.os }}-spm-deps-
    - uses: actions/checkout@v4
    - name: Run tests
      run: swift test -v
